server:
  port: ${SERVER_PORT:8081}
  shutdown: graceful

spring:
  application:
    name: content-service

  # Virtual threads for better I/O performance
  threads:
    virtual:
      enabled: true

  # Database Configuration
  datasource:
    url: jdbc:postgresql://${CONTENT_DB_HOST:localhost}:${CONTENT_DB_PORT:5432}/${CONTENT_DB_NAME:contentdb}
    username: ${CONTENT_DB_USERNAME:postgres}
    password: ${CONTENT_DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 60000
      pool-name: ContentServicePool

  # JPA/Hibernate Configuration
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
          batch_size: 25
        order_inserts: true
        order_updates: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # Flyway Migration
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  # Redis Configuration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 4

  # Cache Configuration
  cache:
    type: redis
    redis:
      time-to-live: 300000
      cache-null-values: false

  # Jackson Configuration
  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
    default-property-inclusion: non_null

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

# OpenAPI/Swagger Configuration
springdoc:
  api-docs:
    path: /api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method
    tags-sorter: alpha

# Application Configuration
app:
  # Auth Service Integration
  auth-service:
    url: ${AUTH_SERVICE_URL:http://localhost:8080}
    timeout-ms: ${AUTH_SERVICE_TIMEOUT_MS:5000}

  # Content Configuration
  content:
    feed-page-size: ${CONTENT_FEED_PAGE_SIZE:20}
    max-content-length: 4096

  # Cache TTL Configuration
  cache:
    content-ttl-minutes: ${CONTENT_CACHE_TTL_MINUTES:60}
    feed-ttl-minutes: ${FEED_CACHE_TTL_MINUTES:5}
    trending-ttl-minutes: ${TRENDING_CACHE_TTL_MINUTES:15}
    user-preferences-ttl-minutes: 30
    auth-token-ttl-seconds: ${AUTH_TOKEN_CACHE_TTL_SECONDS:60}

# Resilience4j Circuit Breaker Configuration
resilience4j:
  circuitbreaker:
    instances:
      authService:
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        sliding-window-size: 10
        permitted-number-of-calls-in-half-open-state: 3
        sliding-window-type: COUNT_BASED
        minimum-number-of-calls: 5
        automatic-transition-from-open-to-half-open-enabled: true
  retry:
    instances:
      authService:
        max-attempts: 3
        wait-duration: 1s
        retry-exceptions:
          - java.net.ConnectException
          - java.net.SocketTimeoutException
  timelimiter:
    instances:
      authService:
        timeout-duration: 5s
        cancel-running-future: true

# Logging Configuration
logging:
  level:
    root: INFO
    com.contentaggregation.content: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
