# Development Profile Configuration
spring:
  # Database - Uses environment variables from docker-compose or falls back to localhost for local dev
  datasource:
    url: jdbc:postgresql://${CONTENT_DB_HOST:localhost}:${CONTENT_DB_PORT:5433}/${CONTENT_DB_NAME:contentdb}
    username: ${CONTENT_DB_USERNAME:postgres}
    password: ${CONTENT_DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  # JPA - Show SQL in dev
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # Redis - Uses environment variables from docker-compose or falls back to localhost for local dev
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  # DevTools
  devtools:
    restart:
      enabled: true
    livereload:
      enabled: true

# Debug logging for development
logging:
  level:
    root: INFO
    com.contentaggregation.content: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.springframework.cache: DEBUG
    io.github.resilience4j: DEBUG

# Actuator - Show all details in dev
management:
  endpoint:
    health:
      show-details: always

# OpenAPI - Enable in dev
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

# Application - Development settings
app:
  auth-service:
    url: ${AUTH_SERVICE_URL:http://localhost:8080}
    timeout-ms: 10000

  cache:
    content-ttl-minutes: 5
    feed-ttl-minutes: 1
    trending-ttl-minutes: 5
    auth-token-ttl-seconds: 30
