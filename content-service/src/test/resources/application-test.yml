server:
  port: 0

spring:
  application:
    name: content-service-test

  # Virtual threads
  threads:
    virtual:
      enabled: true

  # Test Database - Testcontainers will override
  datasource:
    url: jdbc:tc:postgresql:15-alpine:///testdb
    username: test
    password: test
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 30000

  # JPA Configuration
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
          batch_size: 25

  # Flyway
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  # Redis - Testcontainers will override
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 5000ms

  # Cache
  cache:
    type: redis
    redis:
      time-to-live: 60000
      cache-null-values: false

  # Jackson
  jackson:
    serialization:
      write-dates-as-timestamps: false

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  endpoint:
    health:
      show-details: always

# OpenAPI - disabled in tests
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# App Configuration
app:
  auth-service:
    url: http://localhost:8089
    timeout-ms: 5000

  content:
    feed-page-size: 20
    max-content-length: 4096

  cache:
    content-ttl-minutes: 5
    feed-ttl-minutes: 1
    trending-ttl-minutes: 2
    user-preferences-ttl-minutes: 5

# Resilience4j
resilience4j:
  circuitbreaker:
    instances:
      authService:
        failure-rate-threshold: 50
        wait-duration-in-open-state: 5s
        sliding-window-size: 5
        permitted-number-of-calls-in-half-open-state: 2
        minimum-number-of-calls: 3
  retry:
    instances:
      authService:
        max-attempts: 2
        wait-duration: 500ms
  timelimiter:
    instances:
      authService:
        timeout-duration: 3s

# Logging
logging:
  level:
    root: INFO
    com.contentaggregation.content: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
    org.testcontainers: INFO
    com.github.dockerjava: WARN
