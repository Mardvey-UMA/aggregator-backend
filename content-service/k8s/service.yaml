apiVersion: v1
kind: Service
metadata:
  name: content-service
  labels:
    app: content-service
spec:
  type: ClusterIP
  ports:
    - port: 8081
      targetPort: 8081
      protocol: TCP
      name: http
  selector:
    app: content-service
---
apiVersion: v1
kind: Service
metadata:
  name: content-service-headless
  labels:
    app: content-service
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - port: 8081
      targetPort: 8081
      protocol: TCP
      name: http
  selector:
    app: content-service
