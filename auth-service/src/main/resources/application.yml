server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  servlet:
    context-path: /

spring:
  application:
    name: auth-service

  # Enable Virtual Threads (Java 21)
  threads:
    virtual:
      enabled: true

  # Profile configuration
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # Database Configuration
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:authdb}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 60000
      pool-name: AuthServiceHikariCP

  # JPA/Hibernate Configuration
  jpa:
    database: postgresql
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        default_schema: public
        jdbc:
          time_zone: UTC
          batch_size: 25
        order_inserts: true
        order_updates: true
        type:
          preferred_array_jdbc_type_code: 2003

  # Flyway Migration Configuration
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    schemas: public
    validate-on-migrate: true

  # Redis Configuration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 10000
      lettuce:
        pool:
          max-active: 10
          max-idle: 5
          min-idle: 1
          max-wait: 5000

  # Security Configuration
  security:
    oauth2:
      client:
        registration:
          vk:
            client-name: VK
            client-id: ${VK_CLIENT_ID:your_vk_application_id}
            client-secret: ${VK_CLIENT_SECRET:your_vk_client_secret}
            redirect-uri: ${VK_REDIRECT_URI:http://localhost:8080/api/v1/auth/oauth2/callback/vk}
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
            scope:
              - email
        provider:
          vk:
            authorization-uri: https://oauth.vk.com/authorize
            token-uri: https://oauth.vk.com/access_token
            user-info-uri: https://api.vk.com/method/users.get?v=5.131&fields=photo_200,screen_name
            user-name-attribute: response

  # Jackson Configuration
  jackson:
    serialization:
      write-dates-as-timestamps: false
      fail-on-empty-beans: false
    deserialization:
      fail-on-unknown-properties: false
    default-property-inclusion: non_null
    time-zone: UTC

# JWT Configuration
jwt:
  # Base64 encoded secret (at least 256 bits / 32 bytes)
  secret: ${JWT_SECRET:ZGV2LXN1cGVyLXNlY3JldC1qd3Qta2V5LWZvci1sb2NhbC1kZXZlbG9wbWVudC1vbmx5LW1pbi0yNTYtYml0cw==}
  access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:900000}  # 15 minutes in ms
  refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:604800000}  # 7 days in ms
  issuer: content-aggregation-auth

# Metrics Service Integration
metrics:
  service:
    url: ${METRICS_SERVICE_URL:http://localhost:8082}
    timeout-ms: ${METRICS_SERVICE_TIMEOUT_MS:5000}

# Onboarding Configuration
onboarding:
  min-categories: ${ONBOARDING_MIN_CATEGORIES:3}
  max-categories: ${ONBOARDING_MAX_CATEGORIES:5}
  version: ${ONBOARDING_VERSION:v1}

# Application Configuration
app:
  frontend-url: ${FRONTEND_URL:http://localhost:3000}

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
  health:
    db:
      enabled: true
    redis:
      enabled: true
    livenessState:
      enabled: true
    readinessState:
      enabled: true
  info:
    env:
      enabled: true

# OpenAPI/Swagger Configuration
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method
    tags-sorter: alpha
    doc-expansion: none
  show-actuator: false

# Logging Configuration
logging:
  level:
    root: INFO
    com.contentaggregation: INFO
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

# Application Info
info:
  app:
    name: ${spring.application.name}
    description: Authentication and Authorization Service
    version: "@project.version@"
    java-version: ${java.version}
