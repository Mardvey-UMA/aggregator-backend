apiVersion: v1
kind: ConfigMap
metadata:
  name: auth-service-config
  namespace: default
  labels:
    app: auth-service
data:
  SPRING_PROFILES_ACTIVE: "prod"
  SERVER_PORT: "8080"
  DB_PORT: "5432"
  DB_NAME: "authdb"
  DB_POOL_SIZE: "20"
  REDIS_PORT: "6379"
  JWT_ACCESS_TOKEN_EXPIRATION: "900000"
  JWT_REFRESH_TOKEN_EXPIRATION: "604800000"
  FRONTEND_URL: "https://app.contentaggregation.com"
