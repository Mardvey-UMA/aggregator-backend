apiVersion: v1
kind: Secret
metadata:
  name: auth-service-secrets
  namespace: default
  labels:
    app: auth-service
type: Opaque
stringData:
  # IMPORTANT: Replace these with actual production values
  # Use: kubectl create secret generic auth-service-secrets --from-literal=...
  DB_HOST: "postgres-service"
  DB_USERNAME: "postgres"
  DB_PASSWORD: "CHANGE_ME_IN_PRODUCTION"
  REDIS_HOST: "redis-service"
  REDIS_PASSWORD: ""
  JWT_SECRET: "CHANGE_ME_BASE64_ENCODED_SECRET_MIN_256_BITS"
  VK_CLIENT_ID: "your_vk_client_id"
  VK_CLIENT_SECRET: "your_vk_client_secret"
  VK_REDIRECT_URI: "https://api.contentaggregation.com/api/v1/auth/oauth2/callback/vk"
