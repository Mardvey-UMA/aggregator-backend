spring:
  config:
    activate:
      on-profile: prod

  datasource:
    hikari:
      maximum-pool-size: ${METRICS_DB_POOL_SIZE:50}

management:
  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    root: WARN
    com.contentaggregation.metrics: INFO

app:
  kafka:
    topics:
      replication-factor: ${KAFKA_TOPIC_REPLICATION:3}

